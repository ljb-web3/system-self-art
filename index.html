<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const languageKey = 'system-self-language-preference'
        const themeKey = 'system-self-theme-preference'
        let savedLanguage = null
        let savedTheme = null

        try {
          savedLanguage = localStorage.getItem(languageKey)
          savedTheme = localStorage.getItem(themeKey)
        } catch {
          // Browser preferences still work when storage is unavailable.
        }

        const supportedLanguage = (locale) => {
          if (typeof locale !== 'string') return null
          if (/^fr/i.test(locale)) return 'fr'
          if (/^en/i.test(locale)) return 'en'
          return null
        }
        const preferredLanguages = Array.from(navigator.languages || [])
        const detectedLanguage = preferredLanguages.map(supportedLanguage).find(Boolean)
          || supportedLanguage(navigator.language)
          || 'en'

        document.documentElement.lang = savedLanguage === 'en' || savedLanguage === 'fr'
          ? savedLanguage
          : detectedLanguage
        document.documentElement.dataset.theme = savedTheme === 'white' || savedTheme === 'black'
          ? savedTheme
          : 'black'
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SYSTEMSELF.ART — research experiments in communication, connection, observation, and systems." />
    <title>SYSTEMSELF.ART</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
